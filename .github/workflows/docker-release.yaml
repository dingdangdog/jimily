name: Docker

on:
  push:
    tags:
      - v*.*.*

permissions:
  contents: read

concurrency:
  group: docker-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker_build:
    environment: docker_hub
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 确保能获取到 tags 用于生成版本号

      - name: Get version
        id: get_version
        # 提取语义化版本号，例如从 v5.1.3 提取出 5.1.3
        run: |
          VERSION=$(git describe --tags --always --match 'v*' | sed -n 's|^v\([0-9]*\.[0-9]*\.[0-9]*\)\(-.*\)\{0,1\}|\1|p')
          if [ -z "$VERSION" ]; then
            echo "无法从标签 ${GITHUB_REF_NAME} 解析出版本号，期望 vX.Y.Z"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64 # 明确指定需要模拟的平台

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push multi-platform image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            dingdangdog/jimily:${{ steps.get_version.outputs.VERSION }}
            dingdangdog/jimily:latest
          # 关键改进：启用 GitHub Actions 缓存后端
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 传递构建参数（如果你的 Dockerfile 需要 VERSION 变量可以开启下面这行）
          # build-args: |
          #   APP_VERSION=${{ steps.get_version.outputs.VERSION }}

  github_release:
    name: GitHub Release
    needs: docker_build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.docker_build.outputs.version }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          NOTES="$(mktemp)"
          {
            echo "Docker 镜像已发布到 Docker Hub："
            echo ""
            echo "- \`dingdangdog/jimily:${VERSION}\`"
            echo "- \`dingdangdog/jimily:latest\`"
            echo ""
          } > "$NOTES"

          RELEASE_FLAGS=()
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            RELEASE_FLAGS+=(--latest)
          else
            RELEASE_FLAGS+=(--prerelease)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --draft=false "${RELEASE_FLAGS[@]}"
            echo "Release ${TAG} 已存在，已保持为已发布状态。"
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file "$NOTES" \
              --generate-notes \
              "${RELEASE_FLAGS[@]}"
            echo "已创建 Release ${TAG}。"
          fi
